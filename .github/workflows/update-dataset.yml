name: Shared dataset update

on:
  workflow_call:
    inputs:
      products:
        description: Space-separated product slugs
        required: true
        type: string
      report_name:
        description: Short name used for the artifact
        required: true
        type: string
      publish_release:
        description: Publish the validated snapshot after updating
        required: false
        default: false
        type: boolean
      snapshot_date:
        description: Snapshot date in ICT (UTC+7). Defaults to yesterday when blank.
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: vietlott-dataset-writer
  cancel-in-progress: false

jobs:
  update:
    name: Update and validate dataset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      data_changed: ${{ steps.commit.outputs.changed }}
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Check out data branch
        uses: actions/checkout@v6
        with:
          ref: datasets
          path: dataset-branch
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Save pre-update reports
        shell: bash
        run: |
          before_dir="$RUNNER_TEMP/vietlott-reports/before"
          mkdir -p "$before_dir"
          for file in \
            dataset-branch/datasets/metadata/dataset-summary.json \
            dataset-branch/datasets/metadata/quality-report.json \
            dataset-branch/datasets/metadata/snapshot-manifest.json; do
            if test -f "$file"; then
              cp "$file" "$before_dir/$(basename "$file")"
            fi
          done

      - name: Restore working dataset
        run: vietlott-repository-data hydrate --source-dir dataset-branch/datasets --destination-dir data

      - name: Collect new draws from primary sources
        id: update
        continue-on-error: true
        shell: bash
        env:
          PRODUCTS: ${{ inputs.products }}
        run: |
          read -r -a selected_products <<< "$PRODUCTS"
          vietlott-auto-update \
            --products "${selected_products[@]}" \
            --output-dir data \
            --reconcile-pages 2 \
            --request-delay 0.8 \
            --jitter 0.25 \
            --retries 5 \
            --strict

      - name: Package and validate dataset
        shell: bash
        run: |
          report_dir="$RUNNER_TEMP/vietlott-reports"
          mkdir -p "$report_dir"
          if test -f data/incremental-update-report.json; then
            cp data/incremental-update-report.json "$report_dir/update-report.json"
          fi
          vietlott-repository-data publish \
            --source-dir data \
            --destination-dir dataset-branch/datasets \
            > "$report_dir/publish-report.json"

      - name: Sync data branch before validation
        shell: bash
        run: |
          git -C dataset-branch add -A datasets
          patch_file="$RUNNER_TEMP/vietlott-data-update.patch"
          git -C dataset-branch diff --cached --binary -- datasets > "$patch_file"
          git -C dataset-branch fetch origin datasets
          if test "$(git -C dataset-branch rev-parse HEAD)" = "$(git -C dataset-branch rev-parse FETCH_HEAD)"; then
            exit 0
          fi

          git -C dataset-branch reset --hard FETCH_HEAD
          if test -s "$patch_file"; then
            git -C dataset-branch apply --3way "$patch_file"
          fi

      - name: Validate snapshot after sync
        shell: bash
        run: |
          report_dir="$RUNNER_TEMP/vietlott-reports"
          mkdir -p "$report_dir"
          vietlott-repository-data audit \
            --source-dir dataset-branch/datasets \
            > "$report_dir/quality-audit.json"
          vietlott-repository-data validate \
            --source-dir dataset-branch/datasets \
            > "$report_dir/validation-report.json"
          after_dir="$report_dir/after"
          mkdir -p "$after_dir"
          cp dataset-branch/datasets/metadata/dataset-summary.json "$after_dir/"
          cp dataset-branch/datasets/metadata/quality-report.json "$after_dir/"
          cp dataset-branch/datasets/metadata/snapshot-manifest.json "$after_dir/"
          python scripts/check_quality_regressions.py \
            --before "$report_dir/before/quality-report.json" \
            --after dataset-branch/datasets/metadata/quality-report.json \
            --output "$report_dir/quality-regressions.json" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Write update summary
        if: always()
        continue-on-error: true
        shell: bash
        run: >
          python scripts/github_update_summary.py
          --update-report "$RUNNER_TEMP/vietlott-reports/update-report.json"
          --validation-report "$RUNNER_TEMP/vietlott-reports/validation-report.json"
          --output "$GITHUB_STEP_SUMMARY"

      - name: Upload collection reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: vietlott-${{ inputs.report_name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/vietlott-reports
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit data changes
        id: commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C dataset-branch add -A datasets
          if git -C dataset-branch diff --cached --quiet; then
            echo "No new draws or official changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -C dataset-branch config user.name "github-actions[bot]"
          git -C dataset-branch config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C dataset-branch commit -m "data: update Vietlott results"
          gh auth setup-git
          git -C dataset-branch push origin HEAD:datasets
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish daily snapshot
        if: ${{ inputs.publish_release && steps.update.outcome == 'success' && steps.commit.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_DATE: ${{ inputs.snapshot_date }}
        run: >-
          gh auth setup-git &&
          python scripts/publish_dataset_release.py
          --repository-dir dataset-branch
          --data-dir dataset-branch/datasets
          --snapshot-date "$SNAPSHOT_DATE"
          --source-commit "$GITHUB_SHA"

      - name: Report source failure after preserving valid data
        if: steps.update.outcome == 'failure'
        run: exit 1
