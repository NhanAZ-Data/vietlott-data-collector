name: Report a data issue
description: Report missing, incorrect, duplicated, or conflicting records
title: "data: "
labels:
  - data-quality
body:
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - Mega 6/45
        - Power 6/55
        - Lotto 5/35
        - Keno
        - Bingo18
        - Max 3D
        - Max 3D Pro
        - Max 4D
    validations:
      required: true
  - type: input
    id: draw
    attributes:
      label: Draw ID
  - type: textarea
    id: observed
    attributes:
      label: Current data
      description: Provide the value, file, and row if known
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected data
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources to compare
      description: Provide URLs and access times
    validations:
      required: true
